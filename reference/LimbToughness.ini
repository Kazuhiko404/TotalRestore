[LimbToughness]
; Percentage bonus to fleshy limb max health per point of Toughness.
; 0.5 = +0.5% per Toughness, 1.0 = +1% per Toughness. Missing/invalid -> 0.5.
HealthPercentPerToughness=0.5
; 0 = getter-only, 1 = setup, 2 = init, 3 = updateStats, 4 = all stored paths.
ApplicationMode=4
; Include installed robotic limbs in the bonus (1 = yes, 0 = no).
ApplyToSkeletonsAndRobotLimbs=1
; Include skeleton/robot races (1 = yes, 0 = fleshy races only).
; Default 1 so custom races cloned from the Skeleton template keep working.
ApplyToRobotRaces=1
; Include animal races (1 = yes, 0 = leave wild/beast creatures untouched).
ApplyToAnimals=1
