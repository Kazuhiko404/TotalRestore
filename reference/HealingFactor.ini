[HealingFactor]
; Settings are read once at plugin startup, so restart Kenshi after editing.
; Switches use 1 for enabled and 0 for disabled.

; MASTER AND TARGETING
; 1 enables configured features for characters selected below. 0 leaves the
; DLL loaded but installs no gameplay hooks and changes nothing in the game.
EnableMod=1

; Exact, case-sensitive text required at the end of a character's name.
; Example: the default period selects "Jake." but not "Jake". Ignored when
; ApplyToAllPlayerHumanoids=1 and cannot be empty otherwise.
NameSuffix=.

; 1 targets every humanoid player character and ignores NameSuffix. 0 uses
; NameSuffix. NPCs and animals are never affected by this mod.
ApplyToAllPlayerHumanoids=1

; DEATH PROTECTION
; 1 prevents eligible characters from dying and applies both emergency floors
; below. 0 restores Kenshi's death rules without disabling healing or regrowth.
EnableDeathProtection=1

; Minimum head, chest, and stomach flesh health while death protection is on.
; This is a fraction of maximum health: 0.05 means 5%. Range: 0.01 to 0.50.
EmergencyVitalHealthFraction=0.05

; Minimum blood while death protection is on. This survival floor is separate
; from blood regeneration. 0.10 means 10% of maximum. Range: 0.01 to 0.50.
EmergencyBloodFraction=0.10

; BODY-PART REGENERATION
; 1 enables the organic recovery system controlled by the three layer switches
; below. 0 disables body-part healing without affecting blood or limb regrowth.
EnableBodyPartRegeneration=1

; 1 restores ordinary flesh health toward maximum. 0 leaves flesh damage to
; Kenshi. Requires EnableBodyPartRegeneration=1.
EnableFleshRegeneration=1

; 1 removes temporary stun damage from organic parts. 0 leaves stun damage to
; Kenshi. Requires EnableBodyPartRegeneration=1.
EnableStunRegeneration=1

; 1 removes wear damage from organic parts. 0 leaves wear damage to Kenshi.
; Robotic parts are never healed. Requires EnableBodyPartRegeneration=1.
EnableWearRegeneration=1

; Simulation seconds required to restore damage equal to one body part's full
; maximum health on each enabled layer. Deeper damage takes longer. Minimum: 1.
WoundRegenerationSeconds=30

; Simulation seconds after the latest incoming damage before body recovery
; resumes. 0 heals immediately. Range: 0 to 60. Blood uses this delay only when
; PauseBloodRegenerationDuringDamage=1.
WoundHealingDelaySeconds=2

; BLOOD LOSS AND REGENERATION
; 1 clears Kenshi's remaining bleed rate when configured body recovery finishes
; while flesh regeneration is enabled. 0 preserves native bleeding. This switch
; is independent of blood regeneration and requires both body and flesh healing.
ClearBleedingWhenFullyHealed=1

; 1 lets Healing Factor rapidly refill blood toward maximum. 0 disables only
; that accelerated refill; Kenshi's slower passive recovery remains unchanged.
; Bleeding cleanup and the EmergencyBloodFraction floor are separate controls.
EnableBloodRegeneration=1

; Simulation seconds required to restore an amount equal to maximum blood.
; Partial blood loss recovers proportionally. Minimum: 1. Ignored when disabled.
BloodRegenerationSeconds=240

; 0 lets blood regenerate continuously, including while damage arrives. 1 pauses
; it until WoundHealingDelaySeconds has passed since the latest incoming damage.
; Ignored when EnableBloodRegeneration=0.
PauseBloodRegenerationDuringDamage=1

; LIMB REGENERATION
; 1 allows organic limb regrowth according to the four limb switches below.
; 0 leaves every severed limb as a normal Kenshi stump.
EnableLimbRegeneration=1

; 1 regrows a severed organic left arm when the limb master is on. 0 leaves a
; native stump that can accept a robotic replacement.
EnableLeftArmRegeneration=1

; 1 regrows a severed organic right arm when the limb master is on. 0 leaves a
; native stump that can accept a robotic replacement.
EnableRightArmRegeneration=1

; 1 regrows a severed organic left leg when the limb master is on. 0 leaves a
; native stump that can accept a robotic replacement.
EnableLeftLegRegeneration=1

; 1 regrows a severed organic right leg when the limb master is on. 0 leaves a
; native stump that can accept a robotic replacement.
EnableRightLegRegeneration=1

; Default simulation seconds for a severed limb to grow from its starting size
; to full size. Minimum: 1. A positive arm or leg override replaces this value.
RegenerationSeconds=120

; Growth time used for both arms. 0 inherits RegenerationSeconds; a positive
; value is the complete arm-growth time in simulation seconds.
ArmRegenerationSeconds=0

; Growth time used for both legs. 0 inherits RegenerationSeconds; a positive
; value is the complete leg-growth time in simulation seconds.
LegRegenerationSeconds=0

; Default fraction of full visual size when growth starts: 0.03 means 3%.
; Range: 0.001 to 0.50. A positive arm or leg override replaces this value.
InitialScale=0.03

; Starting-size fraction used for both arms. 0 inherits InitialScale; a positive
; value overrides it and is capped at 0.50.
ArmInitialScale=0

; Starting-size fraction used for both legs. 0 inherits InitialScale; a positive
; value overrides it and is capped at 0.50.
LegInitialScale=0

; Default flesh health assigned when a completed limb becomes usable: 0.10 means
; 10% of that limb's maximum health. Range: 0.01 to 1.00.
CompletionHealthFraction=0.10

; Completion-health fraction used for both arms. 0 inherits
; CompletionHealthFraction; a positive value overrides it and is capped at 1.00.
ArmCompletionHealthFraction=0

; Completion-health fraction used for both legs. 0 inherits
; CompletionHealthFraction; a positive value overrides it and is capped at 1.00.
LegCompletionHealthFraction=0

; Controls visible growth pacing. Smooth eases growth at the start and finish;
; Linear grows at a constant rate. Invalid values fall back to Smooth.
LimbGrowthCurve=Smooth
