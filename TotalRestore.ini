[TotalRestore]
; Every balance value below is configurable. The defaults are the balanced setup; the old
; behaviour stays selectable, e.g. a "cheat" setup:
;   LimbBonusFormula=Percent, HealingFormula=Legacy, EnableDeathProtection=1,
;   RegenCeilingMinFraction=1.0, RegenCeilingMaxFraction=1.0, RegenStartBelowFraction=1.0,
;   ReviveHealthFraction=1.0, EnableReviveTimeLimit=0
; Master switch: 1 enables all plugin hooks, 0 disables the plugin
EnableMod=1

; TARGETING
; 1 applies healing to all player humanoids. 0 requires NameSuffix at the end of the name.
ApplyToAllPlayerHumanoids=1
NameSuffix=.

; LIMB TOUGHNESS MODULE
; Toughness raises each body part's max HP. The bonus is written into the part's real
; max (_maxHealth), so the native health clamp and the healing target agree.
; The unbuffed base is captured per (body part, race) when the character is set up, so
; saves made with the original LimbToughness mod (which baked the buffed max into the
; save) are corrected to base + bonus on load.
EnableLimbToughness=1

; Bonus formula: Scaled (default, capped and race-aware) or Percent (legacy LimbToughness behaviour,
; uses HealthPercentPerToughness and MaxToughnessMultiplier below).
LimbBonusFormula=Scaled

; Toughness at which every Toughness-scaled value reaches its maximum (also used by the healing formula).
; s = min(Toughness, ToughnessCap) / ToughnessCap
ToughnessCap=100

; Scaled formula: bonus = s * LimbBonusAtReference * (LimbBonusReferenceHealth / baseMax) ^ LimbBonusExponent
; It is inverted: low-HP races get a slightly larger bonus. At s = 1: base 80 -> +31.7, 100 -> +30, 200 -> +25.2, 220 -> +24.6
LimbBonusAtReference=30
LimbBonusReferenceHealth=100
; 0 gives every race the same flat bonus
LimbBonusExponent=0.25
; Hard cap of the bonus per part in HP (0 = uncapped)
LimbBonusMaxPerPart=40

; Percent formula only: bonus max health percent per Toughness point (0.5 = +0.5% per Toughness point)
HealthPercentPerToughness=0.5
; Percent formula only: maximum health multiplier cap from toughness (1.5 = max +50% extra HP cap, e.g. 100 -> 150 max HP)
MaxToughnessMultiplier=1.5

; 1 also buffs robotic parts (skeleton bodies and prosthetic limbs). Default 0: robotic parts keep their native max.
ApplyToughnessToRobots=0
; 1 also buffs animals. Default 0: the bonus plus healing let animals outheal their damage (effectively immortal),
; because the combat pause (PauseHealingInCombat) does not detect animals in a fight.
ApplyToughnessToAnimals=0

; 1 (default): when another mod that rewrites limb max HP is loaded (DesolationSystem), a body part whose max HP
; that mod has rewritten is left to it: TotalRestore stops writing its own bonus there, so the two mods no longer
; overwrite each other (and HP no longer drops after first aid or Toughness XP). Parts the other mod does not
; manage keep the TotalRestore bonus. Without such a mod this key changes nothing. 0 = always write (old behaviour).
YieldMaxHealthToOtherMods=1

; HEALING FACTOR MODULE
; Enable body-part and layer healing
EnableBodyPartRegeneration=1
EnableFleshRegeneration=1
EnableStunRegeneration=1
EnableWearRegeneration=1

; Healing formula: Toughness (default) or Legacy.
;   Toughness: rate and ceiling scale with Toughness (s from ToughnessCap above) on the part's base max
;              WITHOUT the limb toughness bonus. Flesh only refills up to the ceiling (it is never lowered
;              if already above it, e.g. after a doctor). Stun and wear recover at the same rate, uncapped.
;   Legacy:    the old behaviour: refill 100% of max over WoundRegenerationSeconds, 0.5x for robotic parts.
HealingFormula=Toughness

; Toughness formula: ceiling = base max * lerp(RegenCeilingMinFraction, RegenCeilingMaxFraction, s)
; (0.10 / 0.50 = 10% of base at Toughness 0, 50% at ToughnessCap). Set both to 1.0 for a full refill.
RegenCeilingMinFraction=0.10
RegenCeilingMaxFraction=0.50
; Passive regen only starts on a body part whose health (flesh minus stun, as the health bar shows it)
; is below this fraction of its max: 0.5 = parts at 50% or more do not regen, so a part at 70% stays at 70%.
; Gated per part, so one badly hurt limb still heals while healthy limbs do not. Applies to flesh, stun
; and wear with both formulas; blood regen and limb regrowth are not affected. Range 0-1 (clamped);
; 1.0 = always heal (old behaviour), 0 = no passive part regen.
RegenStartBelowFraction=0.5
; Toughness formula: speed in percent of base max per minute of simulated time (60 s at 1x game speed),
; lerped by s (1% at Toughness 0, 4% at ToughnessCap). Faster game speeds heal proportionally faster.
RegenRateMinPercentPerMinute=1
RegenRateMaxPercentPerMinute=4

; Legacy formula only: time in simulation seconds to recover 100% health of a standard body part.
; Skeleton parts are halved to match human pace (Legacy formula only).
WoundRegenerationSeconds=60

; 1 pauses all regeneration (wounds, blood, limb regrowth) while the character is knocked out
PauseHealingWhileUnconscious=1

; 1 heals the robotic body parts of skeleton races (same formula as organics; skeletons never regrow limbs)
HealSkeletonParts=1
; 1 also heals robotic prosthetic limbs attached to organic characters (they need repair, not healing)
HealRobotLimbsOnOrganics=0

; Seconds to pause regeneration after taking damage (0 to heal instantly during combat).
; Damage is detected from hits, environmental damage (acid, gas, burns, being eaten, wind)
; and any unexplained drop in a body part's flesh.
WoundHealingDelaySeconds=5

; 1 completely pauses all health and blood regeneration while the character is locked in combat
PauseHealingInCombat=1

; 1 also gives animals TotalRestore healing (wounds, blood, limb regrowth). Default 0: animals keep only their
; native self-heal. The combat pause above does not detect animals in a fight, so with 1 they heal mid-fight
; and become effectively immortal.
ApplyHealingToAnimals=0

; 1 (default): when another mod that rewrites max HP is loaded (DesolationSystem), a flesh drop that only
; pulls HP back down to the current max is that mod clamping HP, not damage, so it does not pause healing.
; Without such a mod this key changes nothing. 0 restores the old watchdog (every drop pauses healing).
TolerateExternalFleshClamp=1

; BLOOD & OIL REGENERATION
; Rapid refill of blood (and skeleton oil) toward maximum
EnableBloodRegeneration=1
; Seconds to refill 100% of blood/oil capacity
BloodRegenerationSeconds=240
; 1 pauses blood/oil regeneration while taking damage
PauseBloodRegenerationDuringDamage=1
; 1 clears lingering bleed rate (and extra body-part blood loss) once blood is full
ClearBleedingWhenFullyHealed=1

; DEATH PROTECTION & EMERGENCY FLOORS
; 1 keeps vital parts and blood above the emergency floors every frame. This makes the squad
; effectively immortal (characters are not even knocked out), so it is off by default.
EnableDeathProtection=0
EmergencyVitalHealthFraction=0.05
EmergencyBloodFraction=0.10

; LIMB REGROWTH (ORGANIC)
; A severed organic limb of a humanoid squad member grows back visibly (port of HealingFactor):
; the organic mesh appears small and its bones grow from InitialScale to full size over
; RegenerationSeconds of simulated time; then the limb becomes usable again.
; - Skeleton races never regrow limbs. Installing a robotic limb on the stump stops the regrowth.
; - A regrowing limb still counts as a stump for gameplay (and in the save file); it cannot be severed again.
; - Growth pauses with the healing pauses (damage, combat, knocked out).
; - Progress is not saved: after a reload the limb restarts from InitialScale. Growth needs an intact
;   bone snapshot of this limb or its mirror taken this session (it waits otherwise).
; Needs the healing engine (EnableBodyPartRegeneration=1 or EnableBloodRegeneration=1).
EnableLimbRegeneration=1
EnableLeftArmRegeneration=1
EnableRightArmRegeneration=1
EnableLeftLegRegeneration=1
EnableRightLegRegeneration=1
; Simulated seconds to fully regrow a limb (>= 1). Arm/Leg overrides: 0 = use RegenerationSeconds
RegenerationSeconds=120
ArmRegenerationSeconds=0
LegRegenerationSeconds=0
; Starting bone size (0.001 - 0.5). Arm/Leg overrides: 0 = use InitialScale
InitialScale=0.03
ArmInitialScale=0
LegInitialScale=0
; Flesh of the regrown limb as a fraction of its max (0.01 - 1). With HealingFormula=Toughness it is
; also limited by the passive regen ceiling (RegenCeiling*); with Legacy only the fraction applies.
; Arm/Leg overrides: 0 = use CompletionHealthFraction
CompletionHealthFraction=0.10
ArmCompletionHealthFraction=0
LegCompletionHealthFraction=0
; Smooth (smoothstep) or Linear growth
LimbGrowthCurve=Smooth

; REVIVE SYSTEM (GUI)
; Enables the in-game UI button to resurrect dead characters
EnableReviveSystem=1
; 1 allows reviving enemies/NPCs and recruiting them; 0 restricts revive to current/former squad members only
AllowRevivingEnemies=1

; 1 enforces a maximum time window after death to revive. 0 allows reviving at any time.
EnableReviveTimeLimit=1
; Maximum time window in in-game minutes after death (e.g. 60 = 1 hour).
; The clock starts when the character dies (recorded at death). A character that died before
; the plugin loaded, or was loaded dead from a save, starts the clock when first seen dead.
; Once this time elapses, the character is permanently dead and cannot be revived.
MaxReviveTimeMinutes=60.0

; Fraction of maximum health restored upon revival (0.10 = 10% HP, 1.0 = full 100% HP).
; The character is healed completely (wounds, stun, wear), then every body part and the blood
; are scaled down to this fraction (clamped to 0.01 - 1.0).
; Default is 0.10 (10%) so characters revive fragile and need medical attention.
ReviveHealthFraction=0.10
